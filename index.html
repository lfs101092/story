<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Генератор иллюзий</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: monospace; }
  #app { position: relative; width: 100vw; height: 100vh; max-width: 56.25vh; background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  
  #start-btn {
    padding: 15px 30px; font-size: 20px; background: #0f0; color: #000; 
    border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    z-index: 10;
  }

  #illusion {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5; background: #000;
  }

  .stripe {
    position: absolute; top: 0; height: 100%; overflow: hidden;
  }
  .stripe img {
    position: absolute; top: 0; height: 100%; width: 100vw; max-width: 56.25vh; object-fit: cover;
    transform: skewY(45deg) scale(1.5); /* Вытягивание под 45 градусов */
  }

  #timer {
    position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; font-weight: bold;
    z-index: 10; display: none; text-shadow: 1px 1px 2px #000;
  }
</style>
</head>
<body>
  <div id="app">
    <button id="start-btn">Выбрать 2 картинки</button>
    <div id="timer">10</div>
    <div id="illusion"></div>
    
    <!-- Скрытый инпут для выбора файлов -->
    <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
  </div>

  <script src="script.js"></script>
</body>
</html>
